name: Ecuavias
on: 
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/setup-node@v2
      - name: Install dependencies
        run: npm install
      - name: Bundle
        run: npm run build